<!doctype html>
<html lang="es-MX" data-composition-variables='[
  {"id":"title","type":"string","label":"Título (escribe la conclusión: subió a / distingue bien cuánto subió)","default":"Empresa de ejemplo: en cinco ejercicios los ingresos subieron a 7.8 veces","group":"Texto"},
  {"id":"unit","type":"string","label":"Subtítulo: indicador y unidad","default":"Ingresos anuales, miles de millones","group":"Texto"},
  {"id":"source","type":"string","label":"Fuente (abajo a la izquierda)","default":"Fuente: datos ilustrativos; empresa y cifras ficticias","group":"Texto"},
  {"id":"badge","type":"string","label":"Etiqueta inferior derecha (con datos ficticios escribe «datos ilustrativos»; con datos reales déjala vacía)","default":"datos ilustrativos","group":"Texto"},
  {"id":"series","type":"string","label":"Datos (array JSON:[{\"label\":\"FY2021\",\"value\":16.68}, …]; para velas cada elemento lleva o/h/l/c)","default":"[{\"label\":\"FY2021\",\"value\":16.68},{\"label\":\"FY2022\",\"value\":26.91},{\"label\":\"FY2023\",\"value\":26.97},{\"label\":\"FY2024\",\"value\":60.92},{\"label\":\"FY2025\",\"value\":130.5}]","group":"Datos"},
  {"id":"chart","type":"enum","label":"Tipo de gráfica","default":"bar","options":[{"value":"bar","label":"Barras"},{"value":"line","label":"Línea"},{"value":"candle","label":"K Línea"}],"group":"Datos"},
  {"id":"decimals","type":"number","label":"Decimales del valor","default":1,"min":0,"max":4,"step":1,"group":"Datos"},
  {"id":"prefix","type":"string","label":"Prefijo del valor (p. ej. ¥)","default":"","group":"Datos"},
  {"id":"suffix","type":"string","label":"Sufijo del valor (p. ej. %)","default":"","group":"Datos"},
  {"id":"highlightIndex","type":"number","label":"Qué elemento anotar (desde 0; -1 = ninguno)","default":4,"min":-1,"max":99,"step":1,"group":"Anotación"},
  {"id":"highlightText","type":"string","label":"Anotación · texto grande","default":"7.8 veces","group":"Anotación"},
  {"id":"highlightSub","type":"string","label":"Anotación · texto chico (cálculo o criterio)","default":"130.5 ÷ 16.7","group":"Anotación"},
  {"id":"mainColor","type":"color","label":"Color principal (barras: la anotada)","default":"#006BA2","group":"Color"},
  {"id":"dimColor","type":"color","label":"Color de las demás barras","default":"#C6D2D8","group":"Color"},
  {"id":"duration","type":"number","label":"Duración (s; con narración, al menos hasta que termine)","default":7,"min":2,"max":120,"step":0.5,"group":"Ritmo"},
  {"id":"pace","type":"number","label":"Factor de ritmo (1 = velocidad normal;1.5 = cada tiempo se multiplica por 1.5)","default":1,"min":0.5,"max":3,"step":0.1,"group":"Ritmo"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Short Reels Motion · Gráfica financiera</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Gráfica financiera (t3, estilo The Economist): primero la maqueta → ejes → los datos crecen → se anota una sola cosa. Los valores siempre son honestos; la animación solo decide cómo aparecen.
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: t3_finance_chart, from huashu-art-motion, MIT).
  - Variables fill the "{{…}}" placeholders in the spec. Timing and structure live in the cues: `at` is the second
    the thing first shows; `word` anchors it to that word of the narration once `om voice` has run (see
    skills/short-reels-motion/references/grammars.md).
  - Pickable regions (ids follow the spec's 0-based indexes): title · unit · source · badge · bar-<i> (series[i];
    point-<i> for a line, candle-<i> for K Línea) · highlight · number-<k>.
  - Scenes (one label per beat): title → chart-1 → highlight-1.
  - Fictional data keeps the datos ilustrativos badge in every frame; real data gets a real source and no badge.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack (−, ←, ∇) fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="chart" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "t3_finance_chart",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "data": {
    "title": "{{title}}",
    "unit": "{{unit}}",
    "source": "{{source}}",
    "badge": "{{badge}}",
    "chart": "{{chart}}",
    "series": "{{series|json}}",
    "decimals": "{{decimals}}",
    "prefix": "{{prefix}}",
    "suffix": "{{suffix}}",
    "highlight": { "index": "{{highlightIndex}}", "text": "{{highlightText}}", "sub": "{{highlightSub}}" },
    "colors": { "main": "{{mainColor}}", "dim": "{{dimColor}}" }
  },
  "cues": [
    { "at": 0.0, "kind": "title" },
    { "at": 1.2, "kind": "bar", "word": "Ingresos" },
    { "at": 4.4, "kind": "highlight", "word": "7.8" }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/t3_finance_chart.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      const d = spec.data, kind = d.chart || 'bar';
      // the data cue draws the chart type the variable asks for
      for (const q of spec.cues) if (['bar', 'line', 'candle'].includes(q.kind)) q.kind = kind;
      if (!d.badge) delete d.badge;
      if (d.highlight.index >= (d.series || []).length) CLIP.problem(`highlightIndex ${d.highlight.index} supera el número de datos (${(d.series || []).length} elementos)`);
      if (!(d.highlight.index >= 0 && d.highlight.index < (d.series || []).length)) { delete d.highlight; spec.cues = spec.cues.filter((q) => q.kind !== 'highlight'); }
      // a line / K-line keeps its own red unless the main color was changed
      if (kind !== 'bar' && d.colors.main.toLowerCase() === '#006ba2') delete d.colors.main;
      if (!Array.isArray(d.series) || !d.series.length) CLIP.problem('series debe ser un array no vacío');
      if (kind === 'candle' && d.series.some((r) => r.h == null)) CLIP.problem('K cada elemento de series de la línea debe tener o / h / l / c');
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
