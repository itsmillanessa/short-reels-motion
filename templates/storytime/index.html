<!doctype html>
<html lang="es-MX" data-composition-variables='[
  {"id":"line1","type":"string","label":"Frase 1 · texto hablado (fija cuánto mueve la boca ≈6.5 caracteres/s; si la frase corta de la burbuja está vacía, la burbuja muestra este texto)","default":"La primera vez que le pedí a la IA que programara por mí,","group":"Frase 1"},
  {"id":"bubble1","type":"string","label":"Frase 1 · texto corto de la burbuja (≤12 caracteres; vacío = muestra el texto hablado)","default":"IA, ¡hazme un sitio web!","group":"Frase 1"},
  {"id":"line1Pose","type":"enum","label":"Frase 1 · pose","default":"talk","options":[{"value":"talk","label":"habla"},{"value":"point","label":"señala"},{"value":"shrug","label":"encoge los hombros"},{"value":"type","label":"teclea"}],"group":"Frase 1"},
  {"id":"typed","type":"string","label":"Plano insertado: la línea que escribió en la computadora","default":"hazme un sitio web","group":"pantalla de la computadora"},
  {"id":"bigText","type":"string","label":"Plano insertado: el texto gigante que cae","default":"3000 líneas","group":"pantalla de la computadora"},
  {"id":"count","type":"number","label":"El contador de arriba a la derecha se detiene en","default":3000,"min":0,"step":1,"group":"pantalla de la computadora"},
  {"id":"unit","type":"string","label":"Unidad del contador","default":" líneas","group":"pantalla de la computadora"},
  {"id":"app","type":"string","label":"Título de la ventana","default":"Asistente IA","group":"pantalla de la computadora"},
  {"id":"hit","type":"number","label":"Momento en que cae el texto gigante (s; con narración sigue a hitWord)","default":3.5,"min":0,"max":120,"step":0.05,"group":"pantalla de la computadora"},
  {"id":"line2","type":"string","label":"Frase 2 (se dice tras el primer plano de reacción)","default":"Y esto… ¿dónde lo pego?","group":"Frase 2"},
  {"id":"line2Pose","type":"enum","label":"Frase 2 · pose","default":"point","options":[{"value":"talk","label":"habla"},{"value":"point","label":"señala"},{"value":"shrug","label":"encoge los hombros"},{"value":"type","label":"teclea"}],"group":"Frase 2"},
  {"id":"mark","type":"string","label":"Símbolo final (vacío = no aparece)","default":"?","group":"Frase 2"},
  {"id":"skin","type":"color","label":"Personaje · tono de piel","default":"#E8B48E","group":"Personaje"},
  {"id":"hair","type":"enum","label":"Personaje · pelo","default":"short","options":[{"value":"short","label":"corto"},{"value":"long","label":"largo"},{"value":"curly","label":"rizado"},{"value":"bun","label":"chongo"},{"value":"buzz","label":"rapado"},{"value":"none","label":"sin pelo"}],"group":"Personaje"},
  {"id":"hairColor","type":"color","label":"Personaje · color del pelo","default":"#2B2119","group":"Personaje"},
  {"id":"top","type":"enum","label":"Personaje · prenda de arriba","default":"hoodie","options":[{"value":"hoodie","label":"sudadera"},{"value":"tee","label":"playera"},{"value":"shirt","label":"camisa"}],"group":"Personaje"},
  {"id":"topColor","type":"color","label":"Personaje · color de la prenda","default":"#2F6FED","group":"Personaje"},
  {"id":"bottomColor","type":"color","label":"Personaje · color del pantalón","default":"#252A36","group":"Personaje"},
  {"id":"accessory","type":"enum","label":"Personaje · accesorio","default":"none","options":[{"value":"none","label":"ninguno"},{"value":"glasses","label":"lentes"},{"value":"headphones","label":"audífonos"},{"value":"cap","label":"gorra"}],"group":"Personaje"},
  {"id":"accessoryColor","type":"color","label":"Personaje · color del accesorio","default":"#1B1B1F","group":"Personaje"},
  {"id":"eyeColor","type":"string","label":"Personaje · color de ojos (vacío = ojos negros)","default":"","group":"Personaje"},
  {"id":"beard","type":"enum","label":"Personaje · barba","default":"none","options":[{"value":"none","label":"sin barba"},{"value":"stubble","label":"de días"},{"value":"full","label":"completa"}],"group":"Personaje"},
  {"id":"beardColor","type":"string","label":"Personaje · color de la barba (vacío = como el pelo)","default":"","group":"Personaje"},
  {"id":"sleeves","type":"enum","label":"Personaje · mangas","default":"auto","options":[{"value":"auto","label":"según la prenda"},{"value":"long","label":"largas"},{"value":"rolled","label":"arremangadas"},{"value":"short","label":"cortas"}],"group":"Personaje"},
  {"id":"tattoos","type":"enum","label":"Personaje · tatuajes","default":"none","options":[{"value":"none","label":"ninguno"},{"value":"forearms","label":"antebrazos"}],"group":"Personaje"},
  {"id":"earring","type":"string","label":"Personaje · arete (un color, o vacío)","default":"","group":"Personaje"},
  {"id":"footwear","type":"enum","label":"Personaje · calzado","default":"sneakers","options":[{"value":"sneakers","label":"tenis"},{"value":"boots","label":"botas"}],"group":"Personaje"},
  {"id":"shoes","type":"color","label":"Personaje · color del calzado","default":"#F4F4F0","group":"Personaje"},
  {"id":"duration","type":"number","label":"Duración (s; con narración al menos hasta que termine; tras el remate deja al menos 0.9 s)","default":8.5,"min":2,"max":120,"step":0.5,"group":"Ritmo"},
  {"id":"pace","type":"number","label":"Factor de ritmo (1 = normal)","default":1,"min":0.5,"max":4,"step":0.1,"group":"Ritmo"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Short Reels Motion · Personaje narrador</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #DCE9EC; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #DCE9EC; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Personaje de trazo simple (y4, storytime): un personaje configurable (grupo «Personaje»: piel, pelo, ropa, accesorio) habla a cámara en un cuarto pequeño; cambia de pose con cortes rápidos y se queda quieto; el chiste llega con planos insertados (la pantalla de la computadora+el texto gigante que cae) y un primer plano de reacción en silencio.
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: y4_storytime, from huashu-art-motion, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the second the thing first
    shows; `word` anchors it to that word of the narration once `om voice` has run; the insert's slam follows data.hitWord
    (skills/short-reels-motion/references/grammars.md). The reaction close-up needs silence: anchor it after the punch word.
  - Pickable regions (0-based like the spec): character · computer · line-<i> (bubble of the i-th point) · mark ·
    screen · typed · big-text · counter.
  - Scenes: talk-1 → screen-1 → react-1 → talk-2 → punchline-1.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="room" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "y4_storytime",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "data": { "character": { "skin": "{{skin}}", "hair": "{{hair}}", "hairColor": "{{hairColor}}", "top": "{{top}}", "topColor": "{{topColor}}", "bottomColor": "{{bottomColor}}", "accessory": "{{accessory}}", "accessoryColor": "{{accessoryColor}}", "eyeColor": "{{eyeColor}}", "beard": "{{beard}}", "beardColor": "{{beardColor}}", "sleeves": "{{sleeves}}", "tattoos": "{{tattoos}}", "earring": "{{earring}}", "footwear": "{{footwear}}", "shoes": "{{shoes}}" } },
  "cues": [
    { "at": 0.1, "kind": "point", "word": "primera vez", "text": "{{line1}}", "sub": "{{bubble1}}", "data": { "pose": "{{line1Pose}}" } },
    { "at": 2.0, "kind": "insert", "word": "sitio web", "text": "{{bigText}}", "sub": "{{typed}}", "data": { "hit": "{{hit}}", "hitWord": "3000", "count": "{{count}}", "unit": "{{unit}}", "app": "{{app}}" } },
    { "at": 4.6, "kind": "react", "word": "3000", "edge": "end", "offset": 0.6 },
    { "at": 5.9, "kind": "point", "word": "esto", "text": "{{line2}}", "data": { "pose": "{{line2Pose}}" } },
    { "at": 7.2, "kind": "highlight", "word": "dónde lo pego", "edge": "end", "data": { "mark": "{{mark}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/y4_storytime.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      for (const q of spec.cues) {
        if (q.sub === '') delete q.sub;                                  // no short bubble text → the bubble shows the line itself
        if (q.kind === 'insert' && !q.data.unit) delete q.data.unit;
      }
      spec.cues = spec.cues.filter((q) => q.kind !== 'highlight' || String(q.data.mark || '').trim());
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
