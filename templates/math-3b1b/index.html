<!doctype html>
<html lang="es-MX" data-composition-variables='[
  {"id":"title","type":"string","label":"Título (primero pregunta, luego demuestra)","default":"Descenso de gradiente: cada paso baja la pendiente","group":"Texto"},
  {"id":"eq1","type":"string","label":"Fórmula 1 (las letras sueltas van en cursiva solas)","default":"L(θ)","group":"Fórmula"},
  {"id":"eq2","type":"string","label":"Fórmula 2 (se transforma desde la 1: los símbolos iguales se mueven a su nuevo sitio)","default":"θ ← θ − η∇L","group":"Fórmula"},
  {"id":"mathColors","type":"string","label":"Colores de símbolos (JSON: símbolo → manim nombre de color o #hex; color = concepto)","default":"{\"L\":\"BLUE_C\",\"θ\":\"YELLOW\",\"η\":\"GREEN_C\"}","group":"Fórmula"},
  {"id":"point1","type":"string","label":"Punto 1 (vacío = no aparece)","default":"Calcula la pendiente en el punto actual ∇L","group":"Texto"},
  {"id":"point2","type":"string","label":"Punto 2 (vacío = no aparece)","default":"Da un paso corto en sentido contrario, de longitud η","group":"Texto"},
  {"id":"highlightIndex","type":"number","label":"Punto a recuadrar al final (desde 0; -1 = ninguno)","default":1,"min":-1,"max":9,"step":1,"group":"Texto"},
  {"id":"curve1Label","type":"string","label":"Curva 1 · etiqueta","default":"pérdida L(θ)","group":"Curva"},
  {"id":"curve1","type":"string","label":"Curva 1 · datos (JSON: array de valores y equiespaciados)","default":"[9, 5.8, 3.4, 1.8, 1.0, 0.8, 1.0, 1.8, 3.4, 5.8, 9]","group":"Curva"},
  {"id":"curve1Color","type":"color","label":"Curva 1 · color","default":"#2dcff4","group":"Curva"},
  {"id":"curve2Label","type":"string","label":"Curva 2 · etiqueta (se transforma desde la curva 1)","default":"Pérdida durante el entrenamiento","group":"Curva"},
  {"id":"curve2","type":"string","label":"Curva 2 · datos (JSON: array de valores y equiespaciados)","default":"[9, 6.2, 4.4, 3.2, 2.4, 1.9, 1.55, 1.3, 1.15, 1.05, 1.0]","group":"Curva"},
  {"id":"curve2Color","type":"color","label":"Curva 2 · color","default":"#2fddb2","group":"Curva"},
  {"id":"duration","type":"number","label":"Duración (s; con narración, al menos hasta que termine)","default":10,"min":2,"max":120,"step":0.5,"group":"Ritmo"},
  {"id":"pace","type":"number","label":"Factor de ritmo (1 = normal; en películas reales se usa 2–3; 3b1b deja ~1 s tras cada animación)","default":1,"min":0.5,"max":4,"step":0.1,"group":"Ritmo"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Short Reels Motion · Explicación estilo 3b1b</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  3Blue1Brown explicación (t1): fondo negro, una sola cosa en pantalla a la vez; texto y fórmulas se escriben (Write) y cada concepto se transforma (Transform) en el siguiente. Color = nombre del concepto.
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: t1_3b1b, from huashu-art-motion, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the second the thing first
    shows; `word` anchors it to that word of the narration once `om voice` has run (skills/short-reels-motion/references/grammars.md).
  - An equation cue keeps hand-spaced `tokens` while its text equals `tokensFor`; edit the variable and the tokens are rebuilt
    from the text (single letters italic, words upright, the symbol colours from mathColors).
  - Pickable regions (0-based like the spec): title · equation · curve · point-<i>.
  - Scenes (one label per beat): title → equation-1 → curve-1 → equation-2 → point-1 → point-2 → curve-2 → highlight-1.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack (−, ←, ∇) fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="board" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "t1_3b1b",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "cues": [
    { "at": 0.0, "kind": "title", "text": "{{title}}" },
    { "at": 1.2, "kind": "equation", "word": "pérdida", "text": "{{eq1}}", "data": { "tokensFor": "L(θ)", "tokens": [
      { "s": "L", "it": true, "col": "BLUE_C" }, { "s": "(", "gap": 4 }, { "s": "θ", "it": true, "col": "YELLOW", "gap": 4 }, { "s": ")" } ] } },
    { "at": 2.0, "kind": "line", "word": "Curva", "text": "{{curve1Label}}", "data": { "values": "{{curve1|json}}", "color": "{{curve1Color}}" } },
    { "at": 3.6, "kind": "equation", "word": "actualizar", "text": "{{eq2}}", "data": { "tokensFor": "θ ← θ − η∇L", "tokens": [
      { "s": "θ", "it": true, "col": "YELLOW" }, { "s": "←", "gap": 18 }, { "s": "θ", "it": true, "col": "YELLOW", "gap": 14 },
      { "s": "−", "gap": 14 }, { "s": "η", "it": true, "col": "GREEN_C", "gap": 8 }, { "s": "∇", "gap": 4 }, { "s": "L", "it": true, "col": "BLUE_C" } ] } },
    { "at": 4.6, "kind": "point", "word": "pendiente", "text": "{{point1}}" },
    { "at": 5.8, "kind": "point", "word": "sentido contrario", "text": "{{point2}}" },
    { "at": 7.0, "kind": "line", "word": "entrenamiento", "text": "{{curve2Label}}", "data": { "values": "{{curve2|json}}", "color": "{{curve2Color}}" } },
    { "at": 8.4, "kind": "highlight", "word": "un paso pequeño", "data": { "index": "{{highlightIndex}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/t1_3b1b.js"></script>
<script>
  // Text → equation tokens: single letters italic, letter runs (softmax) upright, a little air around operators.
  const OPS = /^[←→⇒=≈≠<>≤≥+−×÷·-]$/;
  function mathTokens(text, colors) {
    const parts = (String(text).match(/[A-Za-z]{2,}|\S/gu) || []).flatMap((s) => (s.length > 1 && !/[a-z]/.test(s) ? [...s] : [s]));
    const toks = parts.map((s) => ({ s, it: /^[a-zA-Zα-ωΑ-Ω]$/.test(s) && s !== '∇', ...(colors[s] ? { col: colors[s] } : {}) }));
    toks.forEach((tk, i) => { if (OPS.test(tk.s)) { tk.gap = 14; if (i) toks[i - 1].gap = 14; } });
    return toks;
  }

  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec, V) {
      const colors = CLIP.json(V.mathColors, {}, 'mathColors') || {};
      for (const q of spec.cues) {
        if (q.kind === 'equation') {
          if (!q.data || q.text !== q.data.tokensFor) q.data = { tokens: mathTokens(q.text, colors) };
          else q.data.tokens = q.data.tokens.map((tk) => (colors[tk.s] ? { ...tk, col: colors[tk.s] } : tk));
        }
        if (q.kind === 'line' && !Array.isArray(q.data.values)) CLIP.problem('los datos de la curva deben ser un array de números, p. ej. [9, 5, 3, 2]');
      }
      const points = spec.cues.filter((q) => q.kind === 'point').length;
      for (const q of spec.cues) if (q.kind === 'highlight' && q.data.index >= points) CLIP.problem(`highlightIndex ${q.data.index} supera el número de puntos (${points} puntos)`);
      spec.cues = spec.cues.filter((q) => !(q.kind === 'equation' && !String(q.text || '').trim()) && !(q.kind === 'highlight' && !(q.data.index >= 0 && q.data.index < points)));
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
