<!doctype html>
<html lang="es-MX" data-composition-variables='[
  {"id":"title","type":"string","label":"Título","default":"Por qué la IA dice disparates tan seria","group":"Texto"},
  {"id":"point1","type":"string","label":"Punto 1 (vacío = no se escribe)","default":"Ha leído una cantidad enorme de texto","group":"Paso 1"},
  {"id":"draw1Text","type":"string","label":"Icono 1 · texto debajo (vacío = no se dibuja el icono)","default":"Texto masivo","group":"Paso 1"},
  {"id":"draw1Icon","type":"enum","label":"Icono 1","default":"stack","options":[{"value":"person"},{"value":"cat"},{"value":"network"},{"value":"doc"},{"value":"chat"},{"value":"bulb"},{"value":"check"},{"value":"cross"},{"value":"screen"},{"value":"stack"},{"value":"gear"},{"value":"target"},{"value":"clock"},{"value":"chart"}],"group":"Paso 1"},
  {"id":"point2","type":"string","label":"Punto 2 (vacío = no se escribe)","default":"Lo que aprende es qué palabra sigue","group":"Paso 2"},
  {"id":"draw2Text","type":"string","label":"Icono 2 · texto debajo (vacío = no se dibuja el icono)","default":"Adivina la siguiente","group":"Paso 2"},
  {"id":"draw2Icon","type":"enum","label":"Icono 2","default":"network","options":[{"value":"person"},{"value":"cat"},{"value":"network"},{"value":"doc"},{"value":"chat"},{"value":"bulb"},{"value":"check"},{"value":"cross"},{"value":"screen"},{"value":"stack"},{"value":"gear"},{"value":"target"},{"value":"clock"},{"value":"chart"}],"group":"Paso 2"},
  {"id":"point3","type":"string","label":"Punto 3 (vacío = no se escribe)","default":"Nadie le enseñó a decir «no sé»","group":"Paso 3"},
  {"id":"draw3Text","type":"string","label":"Icono 3 · texto debajo (vacío = no se dibuja el icono)","default":"Contesta igual","group":"Paso 3"},
  {"id":"draw3Icon","type":"enum","label":"Icono 3","default":"chat","options":[{"value":"person"},{"value":"cat"},{"value":"network"},{"value":"doc"},{"value":"chat"},{"value":"bulb"},{"value":"check"},{"value":"cross"},{"value":"screen"},{"value":"stack"},{"value":"gear"},{"value":"target"},{"value":"clock"},{"value":"chart"}],"group":"Paso 3"},
  {"id":"highlightIndex","type":"number","label":"Punto a encerrar al final (desde 0; -1 = ninguno)","default":2,"min":-1,"max":9,"step":1,"group":"Lo importante"},
  {"id":"highlightStyle","type":"enum","label":"Forma de marcar","default":"circle","options":[{"value":"circle","label":"Círculo naranja"},{"value":"underline","label":"Subrayado naranja"}],"group":"Lo importante"},
  {"id":"accent","type":"color","label":"Color de acento (viñetas, flechas, círculos)","default":"#EF7226","group":"Lo importante"},
  {"id":"duration","type":"number","label":"Duración (s; con narración, al menos hasta que termine)","default":10,"min":2,"max":120,"step":0.5,"group":"Ritmo"},
  {"id":"pace","type":"number","label":"Factor de ritmo (1 = normal; en películas reales cada pizarrón dura ~6 s; se usa 2–2.5)","default":1,"min":0.5,"max":4,"step":0.1,"group":"Ritmo"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Short Reels Motion · Pizarrón a mano</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #FBFBFB; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #FBFBFB; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Pizarrón a mano (y3, estilo RSA): se escribe cada frase mientras se dice y se dibuja lo que se menciona. Un marcador escribe, dibuja iconos y flechas, encierra lo importante; la cámara baja siguiendo y al final se aleja para ver todo.
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: y3_whiteboard, from huashu-art-motion, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the second the first stroke
    lands; `word` anchors it to that word of the narration once `om voice` has run — whiteboard writing looks right about
    0.5 s after the phrase starts, so the cues carry "offset": 0.5 (skills/short-reels-motion/references/grammars.md).
  - Writing speed adapts: a line always finishes before the next cue starts.
  - Pickable regions (0-based like the spec): title · point-<i> · draw-<i> (icon + caption) · image-<i>.
  - Scenes: title → point-1 → draw-1 → point-2 → draw-2 → point-3 → draw-3 → circle-1.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="board" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "y3_whiteboard",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "data": { "accent": "{{accent}}" },
  "cues": [
    { "at": 0.0, "kind": "title", "text": "{{title}}" },
    { "at": 1.9, "kind": "point", "word": "masivo", "offset": 0.5, "text": "{{point1}}" },
    { "at": 2.8, "kind": "draw", "word": "Texto", "offset": 0.5, "text": "{{draw1Text}}", "data": { "icon": "{{draw1Icon}}" } },
    { "at": 3.9, "kind": "point", "word": "aprende", "offset": 0.5, "text": "{{point2}}" },
    { "at": 4.9, "kind": "draw", "word": "siguiente palabra", "offset": 0.5, "text": "{{draw2Text}}", "data": { "icon": "{{draw2Icon}}" } },
    { "at": 6.0, "kind": "point", "word": "nadie le enseñó", "offset": 0.5, "text": "{{point3}}" },
    { "at": 6.9, "kind": "draw", "word": "no sé", "offset": 0.5, "text": "{{draw3Text}}", "data": { "icon": "{{draw3Icon}}" } },
    { "at": 8.0, "kind": "highlight", "word": "igual", "data": { "index": "{{highlightIndex}}", "style": "{{highlightStyle}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/y3_whiteboard.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      const points = spec.cues.filter((q) => q.kind === 'point').length;
      for (const q of spec.cues) if (q.kind === 'highlight') {
        if (q.data.style !== 'underline') delete q.data.style;
        if (q.data.index >= points) CLIP.problem(`highlightIndex ${q.data.index} supera el número de puntos (${points} puntos)`);
      }
      spec.cues = spec.cues.filter((q) => q.kind !== 'highlight' || (q.data.index >= 0 && q.data.index < points));
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
