<!doctype html>
<html lang="es-MX" data-composition-variables='[
  {"id":"title","type":"string","label":"Título (sube letra por letra arriba; se desvanece en el primer acercamiento)","default":"¿Qué hay dentro de un modelo grande de lenguaje?","group":"la primera capa"},
  {"id":"center","type":"string","label":"Nombre del planeta central","default":"Modelo grande","group":"la primera capa"},
  {"id":"point1","type":"string","label":"Satélite 1 (vacío = no aparece)","default":"Miles de millones de parámetros","group":"la primera capa"},
  {"id":"point2","type":"string","label":"Satélite 2 (vacío = no aparece)","default":"Decenas de capas de red","group":"la primera capa"},
  {"id":"point3","type":"string","label":"Satélite 3 (vacío = no aparece)","default":"Un vocabulario","group":"la primera capa"},
  {"id":"diveIndex","type":"number","label":"En qué satélite entrar (desde 0)","default":1,"min":0,"max":9,"step":1,"group":"entrar"},
  {"id":"dive","type":"string","label":"Nombre del nuevo centro tras entrar","default":"una de las capas","group":"entrar"},
  {"id":"point4","type":"string","label":"Satélite interior 1 (vacío = no aparece)","default":"atención","group":"entrar"},
  {"id":"point5","type":"string","label":"Satélite interior 2 (vacío = no aparece)","default":"Red feed-forward","group":"entrar"},
  {"id":"highlightIndex","type":"number","label":"Satélite interior al que acercarse al final (desde 0; -1 = ninguno)","default":0,"min":-1,"max":9,"step":1,"group":"entrar"},
  {"id":"flow","type":"boolean","label":"Satélites encadenados (actívalo cuando expliques un orden)","default":false,"group":"escena"},
  {"id":"planetColor","type":"color","label":"Color del planeta central","default":"#F48301","group":"escena"},
  {"id":"duration","type":"number","label":"Duración (s; con narración, al menos hasta que termine)","default":10,"min":2,"max":120,"step":0.5,"group":"Ritmo"},
  {"id":"pace","type":"number","label":"Factor de ritmo (1 = normal; en películas reales aprox. 7–9 s por plano, se usa 2–3)","default":1,"min":0.5,"max":4,"step":0.1,"group":"Ritmo"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Short Reels Motion · Divulgación plana estilo Kurzgesagt</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05020F; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #05020F; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Kurzgesagt divulgación plana (y1): un planeta brillante en un cielo índigo = el concepto a explicar; cada punto es un satélite; enter mete la cámara en un satélite,
  se acerca hasta que su color llena la pantalla y sale desde un planeta nuevo del mismo color: «qué hay dentro». La imagen siempre se mueve suavemente.
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: y1_kurzgesagt, from huashu-art-motion, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the second the thing first
    shows; `word` anchors it to that word of the narration once `om voice` has run (skills/short-reels-motion/references/grammars.md).
  - Points after an `enter` belong to the new layer; write their `at` after enter.at + 1.6 (the dive takes 1.6 s).
  - Pickable regions (0-based like the spec): title · planet (the centre of the layer on screen) · point-<i> (node + label).
  - Scenes: title → layer-1 → dive-1 → layer-2 → focus-1.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="sky" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "y1_kurzgesagt",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "data": { "center": "{{center}}", "flow": "{{flow}}", "planetColor": "{{planetColor}}" },
  "cues": [
    { "at": 0.0, "kind": "title", "text": "{{title}}" },
    { "at": 1.4, "kind": "point", "word": "parámetros", "text": "{{point1}}" },
    { "at": 2.3, "kind": "point", "word": "red", "text": "{{point2}}" },
    { "at": 3.2, "kind": "point", "word": "vocabulario", "text": "{{point3}}" },
    { "at": 4.2, "kind": "enter", "word": "una de las capas", "text": "{{dive}}", "data": { "index": "{{diveIndex}}" } },
    { "at": 6.2, "kind": "point", "word": "atención", "text": "{{point4}}" },
    { "at": 7.0, "kind": "point", "word": "feed-forward", "text": "{{point5}}" },
    { "at": 8.0, "kind": "highlight", "word": "lo clave", "data": { "index": "{{highlightIndex}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/y1_kurzgesagt.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      // indexes count the points of one layer; keep them inside that layer
      const enterAt = (spec.cues.find((q) => q.kind === 'enter') || {}).at ?? Infinity;
      const outer = spec.cues.filter((q) => q.kind === 'point' && q.at < enterAt).length, inner = spec.cues.filter((q) => q.kind === 'point' && q.at > enterAt).length;
      for (const q of spec.cues) {
        if (q.kind === 'enter' && !(q.data.index >= 0 && q.data.index < outer)) { CLIP.problem(`diveIndex debe estar entre 0–${outer - 1} `); q.data.index = Math.max(0, outer - 1); }
        if (q.kind === 'highlight' && q.data.index >= inner) CLIP.problem(`highlightIndex supera el número de satélites interiores (${inner} satélites)`);
      }
      spec.cues = spec.cues.filter((q) => q.kind !== 'highlight' || (q.data.index >= 0 && q.data.index < inner));
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
