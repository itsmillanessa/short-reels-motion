<!doctype html>
<html lang="es-MX" data-composition-variables='[
  {"id":"kicker","type":"string","label":"Gancho · texto chico de arriba","default":"LO QUE NADIE TE EXPLICA","group":"Gancho"},
  {"id":"hook1","type":"string","label":"Gancho · línea 1","default":"LA IA","group":"Gancho"},
  {"id":"hook2","type":"string","label":"Gancho · línea 2 (con fondo de color)","default":"NO PIENSA","group":"Gancho"},
  {"id":"hook3","type":"string","label":"Gancho · línea 3 (vacío = no sale)","default":"Y ESO ES BUENA NOTICIA","group":"Gancho"},
  {"id":"beats","type":"string","label":"Frases · JSON [{at o word, big, small, fx}] · fx: slam, rise, count, strike · *palabra* = acento · ~palabra~ = tachada","default":"[{\"at\":2.4,\"big\":\"SOLO *PREDICE*\",\"small\":\"la siguiente palabra más probable\",\"fx\":\"rise\"},{\"at\":4.3,\"big\":\"SUENA *100%* SEGURA\",\"small\":\"aunque no lo esté\",\"fx\":\"count\"},{\"at\":6.2,\"big\":\"~SIEMPRE~ TIENE RAZÓN\",\"small\":\"ni de chiste\",\"fx\":\"strike\"},{\"at\":8.0,\"big\":\"*REVISA* LO IMPORTANTE\",\"small\":\"datos, fechas y nombres\",\"fx\":\"slam\"},{\"at\":9.7,\"big\":\"Y ÚSALA *SIN MIEDO*\",\"small\":\"\",\"fx\":\"rise\"}]","group":"Frases"},
  {"id":"endAt","type":"number","label":"Cierre · empieza en el segundo (con narración: la palabra de endWord)","default":11.3,"min":1,"max":120,"step":0.1,"group":"Cierre"},
  {"id":"endWord","type":"string","label":"Cierre · empieza al decir esta palabra (vacío = usa el segundo)","default":"","group":"Cierre"},
  {"id":"handle","type":"string","label":"Cierre · tu @usuario","default":"@tu_usuario","group":"Cierre"},
  {"id":"cta","type":"string","label":"Cierre · texto de abajo","default":"SÍGUEME PARA MÁS","group":"Cierre"},
  {"id":"endHold","type":"number","label":"Cierre · dura (s)","default":1.6,"min":0.6,"max":6,"step":0.1,"group":"Cierre"},
  {"id":"cover","type":"boolean","label":"Portada en los 2 primeros cuadros (para elegirla en TikTok)","default":true,"group":"Portada"},
  {"id":"coverTitle","type":"string","label":"Portada · título","default":"LA IA NO PIENSA","group":"Portada"},
  {"id":"ground","type":"color","label":"Fondo","default":"#0F1012","group":"Colores"},
  {"id":"ink","type":"color","label":"Texto","default":"#F4F1EA","group":"Colores"},
  {"id":"accent","type":"color","label":"Acento","default":"#FFD23F","group":"Colores"},
  {"id":"accentInk","type":"color","label":"Texto sobre el acento","default":"#0F1012","group":"Colores"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Short Reels Motion · Tipografía con voz</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<script src="vendor/srm.js"></script>
<style id="om-fonts">
@font-face { font-family: "Inter"; src: url("assets/fonts/Inter-var.woff") format("woff"); font-weight: 100 900; font-style: normal; }
</style>
<style>
  :root { --ground: #0F1012; --ink: #F4F1EA; --accent: #FFD23F; --accentInk: #0F1012; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ground); }
  #film { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: "Inter", sans-serif; }
  #film * { box-sizing: border-box; }
  .light { position: absolute; inset: 0; background: radial-gradient(820px 640px at 50% 40%, #ffffff0b, transparent 72%); }
  .flash { position: absolute; inset: 0; background: var(--accent); opacity: 0; pointer-events: none; z-index: 40; }
  section { position: absolute; inset: 0; visibility: hidden; }
  #s-hook { visibility: visible; }                                   /* painted before any seek: frame 0 is the poster */
  #hook3 { visibility: hidden; }
  h1, h2, p { margin: 0; }

  /* Safe area of the feeds (srm check warns about it): text lives between y 230 and 1480 and left of x 920 below y 760. */
  .kick { position: absolute; left: 80px; top: 600px; font-weight: 800; font-size: 34px; letter-spacing: .2em; color: var(--accent); white-space: nowrap; }
  .hook { position: absolute; left: 80px; width: 840px; font-weight: 900; letter-spacing: -.045em; line-height: .95; white-space: nowrap; }
  .hook1 { top: 690px; font-size: 128px; }
  .hook2 { top: 830px; font-size: 128px; }
  .hook3 { top: 1010px; font-size: 52px; letter-spacing: -.01em; white-space: normal; opacity: .9; }
  .pillw { position: relative; display: inline-block; padding: .02em .14em .06em; color: var(--accentInk); isolation: isolate; }
  .pillw .pill { position: absolute; inset: 0; background: var(--accent); z-index: -1; }

  /* one phrase at a time, centred in the safe band (y 430–1330) */
  .beat { position: absolute; left: 80px; width: 840px; top: 430px; height: 900px; display: flex; flex-direction: column; justify-content: center; gap: 34px; visibility: hidden; }
  .big { font-weight: 900; letter-spacing: -.045em; line-height: 1.04; transform-origin: 0 50%; }   /* room for Á É Í Ó Ú under the line above */
  .w { position: relative; display: inline-block; overflow: hidden; vertical-align: top; padding: .2em 0 .16em; margin: -.2em .2em -.16em 0; }   /* room for Á É Í Ó Ú Ñ above the caps */
  .w > span { display: inline-block; }
  .w.em > span { color: var(--accent); }
  .w > i { position: absolute; left: -.04em; right: -.04em; top: .56em; height: .12em; background: var(--accent); transform: scaleX(0); transform-origin: 0 50%; }
  .small { font-weight: 600; font-size: 46px; line-height: 1.15; letter-spacing: -.01em; color: var(--ink); opacity: .7; }

  /* closing */
  .handle { position: absolute; left: 80px; width: 850px; top: 820px; text-align: center; font-weight: 900; font-size: 112px; letter-spacing: -.045em; white-space: nowrap; }
  .cta { position: absolute; left: 80px; width: 850px; top: 980px; text-align: center; font-weight: 800; font-size: 36px; letter-spacing: .18em; color: var(--accent); }

  /* cover: the first two frames, for TikTok's "pick a frame" */
  #s-cover { z-index: 50; background: var(--ground); }
  .cvTitle { position: absolute; left: 80px; width: 840px; top: 640px; font-size: 140px; line-height: .92; font-weight: 900; letter-spacing: -.05em; }
  .cvHandle { position: absolute; left: 80px; width: 850px; top: 1300px; text-align: center; font-size: 56px; font-weight: 900; color: var(--accent); }
</style>
</head>
<body>
<!--
  Tipografía con voz (short-tipografia): no footage; the voice leads and every phrase is one full-screen beat of big words.
  Hook in frame 0 → beats (one phrase each, until the next) → closing card with the creator's handle.

  Each beat: { "at": seconds | "word": a word of the narration, "big": "…", "small": "…", "fx": "slam|rise|count|strike" }.
  *palabra* paints a word in the accent; ~palabra~ strikes it through (fx strike draws the line after the phrase lands);
  fx count counts the first number of the phrase up to its value. The size of "big" follows its length, so it always fits.
  With narration (srm voice), anchor every beat to its word: one animation per sentence, landing on the word that says it.
-->
<div id="film" data-composition-id="film" data-width="1080" data-height="1920" data-platforms="tiktok,reels,shorts">
  <div class="light"></div>

  <section id="s-hook" data-om-id="gancho">
    <p class="kick" id="kick" data-om-id="kicker" data-var-text="kicker"></p>
    <h1 class="hook hook1" id="hook1" data-om-id="hook1" data-var-text="hook1"></h1>
    <h1 class="hook hook2" id="hook2" data-om-id="hook2"><span class="pillw"><span class="pill" id="pill2"></span><span id="hook2t"></span></span></h1>
    <h2 class="hook hook3" id="hook3" data-om-id="hook3" data-var-text="hook3"></h2>
  </section>

  <section id="s-beats" data-om-id="frases"><div id="beats"></div></section>

  <section id="s-end" data-om-id="cierre">
    <p class="handle" id="handle" data-om-id="handle" data-var-text="handle"></p>
    <p class="cta" id="cta" data-om-id="cta" data-var-text="cta"></p>
  </section>

  <section id="s-cover" data-om-id="portada">
    <h1 class="cvTitle" id="cvTitle" data-var-text="coverTitle"></h1>
    <p class="cvHandle" id="cvHandle"></p>
  </section>

  <div class="flash" id="flash"></div>
</div>

<script>
  const V = OM.vars();
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const json = (s, fallback) => { try { const v = JSON.parse(s); return Array.isArray(v) ? v : fallback; } catch (e) { console.warn('[short-tipografia] JSON: ' + e.message); return fallback; } };
  for (const k of ['ground', 'ink', 'accent', 'accentInk']) document.documentElement.style.setProperty('--' + k, V[k]);
  OM.music({ product: 'explainer', bpm: 112 });

  // ---- content
  $('#hook2t').textContent = V.hook2;
  SRM.fit('#hook1', V.hook1, 128); SRM.fit('#hook2', V.hook2, 128);   // the hook lines fit the safe width whatever they say
  $('#cvHandle').textContent = V.handle;
  // "*a b*" accent, "~a~" struck: read word by word, so a mark can span several words
  const words = (raw) => {
    const out = []; let em = false, st = false;
    for (let w of String(raw || '').split(/\s+/).filter(Boolean)) {
      if (w.startsWith('*')) { em = true; w = w.slice(1); }
      if (w.startsWith('~')) { st = true; w = w.slice(1); }
      const closeSt = /~[^\p{L}\p{N}]*$/u.test(w), closeEm = /\*[^\p{L}\p{N}]*$/u.test(w);
      w = w.replace(/[*~]/g, '');
      out.push({ w, em, st });
      if (closeEm) em = false;
      if (closeSt) st = false;
    }
    return out;
  };
  // the size of a phrase follows its longest word and its length (Inter 900 caps ≈ .64 em per letter), so it fits 840 px
  const sizeOf = (ws) => {
    const longest = Math.max(1, ...ws.map((x) => x.w.length)), total = ws.reduce((n, x) => n + x.w.length + 1, 0);
    let s = Math.floor(840 / (longest * 0.64));
    s = Math.min(s, total <= 12 ? 200 : total <= 22 ? 160 : total <= 34 ? 124 : 100);
    return Math.max(72, s);
  };
  const beats = json(V.beats, []);
  $('#beats').innerHTML = beats.map((b, i) => {
    const ws = words(b.big);
    let counted = false;
    const html = ws.map((x) => {
      let inner = esc(x.w);
      if (b.fx === 'count' && !counted && /\d/.test(x.w)) { counted = true; inner = esc(x.w).replace(/\d[\d,.]*/, (n) => `<b class="num" data-n="${n.replace(/,/g, '')}">${n}</b>`); }
      return `<span class="w${x.em ? ' em' : ''}${x.st ? ' st' : ''}"><span>${inner}</span>${x.st ? '<i></i>' : ''}</span>`;
    }).join('');
    return `<div class="beat" id="b${i}" data-om-id="frase-${i + 1}"><h1 class="big" data-layout-allow-overlap style="font-size:${sizeOf(ws)}px">${html}</h1>${b.small ? `<p class="small">${esc(b.small)}</p>` : ''}</div>`;
  }).join('');

  // ---- timing: seconds, or the narration's words when there is one
  const list = beats.map((b, i) => ({ b, el: $('#b' + i), at: SRM.when(b, 2.4 + i * 1.8) })).sort((a, c) => a.at - c.at);
  const tEnd = Math.max((list.length ? list[list.length - 1].at : 2.4) + 1, SRM.when({ word: V.endWord, at: V.endAt }));
  const tl = gsap.timeline({ paused: true });
  tl.set(['#s-beats', '#s-end'], { autoAlpha: 0 }, 0);
  tl.set(['#hook3', '#handle', '#cta'], { autoAlpha: 0 }, 0);

  // cover (2 frames): painted before any seek, like the hook (a set at t=0 is not applied when frame 0 is asked for)
  const c0 = V.cover ? 2 / 30 : 0;
  if (V.cover) { const cv = $('#s-cover'); cv.style.visibility = 'visible'; cv.style.opacity = '1'; tl.set(cv, { autoAlpha: 0 }, c0); }

  // hook: the whole promise is on screen from the first frame; it only settles into place
  tl.addLabel('scene:gancho', 0);
  tl.set('#s-hook', { autoAlpha: 1 }, 0);
  tl.set(['#hook1', '#hook2', '#kick'], { autoAlpha: 1 }, c0);
  tl.fromTo('#hook1', { scale: 1.12 }, { scale: 1, duration: 0.45, ease: 'expo.out', immediateRender: false }, c0); OM.sfx('impact', c0, { gain: 0.6 });
  tl.fromTo('#hook2', { scale: 1.12 }, { scale: 1, duration: 0.45, ease: 'expo.out', immediateRender: false }, c0 + 0.08);
  tl.fromTo('#pill2', { scaleX: 0.6 }, { scaleX: 1, duration: 0.4, ease: 'expo.out', immediateRender: false, transformOrigin: '0 50%' }, c0 + 0.08);
  tl.fromTo('#kick', { x: -24 }, { x: 0, duration: 0.4, ease: 'power3.out', immediateRender: false }, c0);
  if (String(V.hook3).trim()) SRM.kickIn(tl, '#hook3', c0 + 1.1);
  const tFirst = list.length ? list[0].at : tEnd;
  SRM.whipOut(tl, '#s-hook', tFirst);

  // beats: each one from its time to the next; never quite still while it holds
  tl.addLabel('scene:frases', tFirst);
  tl.set('#s-beats', { autoAlpha: 1 }, tFirst);
  list.forEach(({ b, el, at }, i) => {
    const until = Math.min(i + 1 < list.length ? list[i + 1].at : tEnd, tEnd);
    const big = el.querySelector('.big'), small = el.querySelector('.small');
    tl.set(el, { autoAlpha: 1 }, at);
    if (b.fx === 'rise') {
      tl.fromTo(el.querySelectorAll('.w > span'), { yPercent: 120 }, { yPercent: 0, duration: 0.5, stagger: 0.07, ease: 'expo.out', immediateRender: false }, at);
      OM.sfx('whoosh', at, { gain: 0.3 });
    } else {
      SRM.slam(tl, big, at, { scale: 1.35, dur: 0.34, sound: 'pop', gain: 0.5 });
    }
    if (b.fx === 'count') {
      const num = el.querySelector('.num');
      if (num) { const n = Number(num.dataset.n) || 0; SRM.counter(tl, num, at + 0.05, Math.min(until - 0.3, at + 1.0), n, (v) => (Number.isInteger(n) ? Math.round(v).toLocaleString('es-MX') : v.toFixed(1))); OM.sfx('tick', at + 0.9, { gain: 0.4 }); }
    }
    if (b.fx === 'strike') {
      const lines = el.querySelectorAll('.st > i');
      if (lines.length) { tl.fromTo(lines, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: 'power2.out', immediateRender: false }, at + 0.5); tl.to(el.querySelectorAll('.st > span'), { opacity: 0.45, duration: 0.2 }, at + 0.65); OM.sfx('whip', at + 0.5, { gain: 0.45 }); }
    }
    if (small) SRM.kickIn(tl, small, at + 0.3);
    // a long phrase gets a second beat: its accent words (or its small line) pulse once, so it never sits still
    // the pulse scales the whole masked word: scaling the word inside its mask would clip its edges
    const pulse = el.querySelectorAll('.w.em').length ? el.querySelectorAll('.w.em') : small;
    if (pulse && until - at > 1.5) { tl.fromTo(pulse, { scale: 1 }, { scale: 1.1, duration: 0.18, yoyo: true, repeat: 1, ease: 'power2.out', immediateRender: false, transformOrigin: '0 60%' }, at + 1.0); OM.sfx('tick', at + 1.0, { gain: 0.3 }); }
    tl.fromTo(big, { scale: 1 }, { scale: 1.04, duration: Math.max(0.3, until - at - 0.6), ease: 'none', immediateRender: false }, at + 0.5);
    if (i + 1 < list.length) SRM.squash(tl, el, until); else tl.set(el, { autoAlpha: 0 }, until);
  });

  // closing: the handle lands
  SRM.whipOut(tl, '#s-beats', tEnd);
  tl.addLabel('scene:cierre', tEnd);
  tl.set('#s-end', { autoAlpha: 1 }, tEnd);
  SRM.slam(tl, '#handle', tEnd + 0.02, { scale: 1.3 });
  SRM.flash(tl, tEnd + 0.02);
  SRM.kickIn(tl, '#cta', tEnd + 0.4);
  tl.to({}, { duration: V.endHold }, tEnd + 0.4);

  window.__timelines = window.__timelines || {};
  window.__timelines['film'] = tl;
</script>
</body>
</html>
