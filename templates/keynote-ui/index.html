<!doctype html>
<html lang="es-MX" data-composition-variables='[
  {"id":"eyebrow","type":"string","label":"Antetítulo (texto chico sobre el título)","default":"N U E V O  L A N Z A M I E N T O","group":"Título"},
  {"id":"title","type":"string","label":"Título principal (≤6 caracteres o el nombre de un producto)","default":"Animación paramétrica","group":"Título"},
  {"id":"subtitle","type":"string","label":"Subtítulo (una frase ≤16 caracteres)","default":"Un JSON, una animación con duración exacta","group":"Título"},
  {"id":"card1Title","type":"string","label":"Tarjeta 1 · título (vacío = no aparece)","default":"8 gramáticas de animación","group":"Tarjetas"},
  {"id":"card1Sub","type":"string","label":"Tarjeta 1 · texto","default":"De 3Blue1Brown a la tipografía cinética","group":"Tarjetas"},
  {"id":"card1Icon","type":"enum","label":"Tarjeta 1 · icono","default":"layers","options":[{"value":"layers"},{"value":"wave"},{"value":"memory"},{"value":"agent"},{"value":"clock"},{"value":"phone"},{"value":"chart"},{"value":"code"},{"value":"check"},{"value":"play"},{"value":"bolt"},{"value":"lock"},{"value":"none","label":"Sin iconos (se dibuja el número)"}],"group":"Tarjetas"},
  {"id":"card2Title","type":"string","label":"Tarjeta 2 · título (vacío = no aparece)","default":"Exacta al cuadro","group":"Tarjetas"},

  {"id":"card2Icon","type":"enum","label":"Tarjeta 2 · icono","default":"clock","options":[{"value":"layers"},{"value":"wave"},{"value":"memory"},{"value":"agent"},{"value":"clock"},{"value":"phone"},{"value":"chart"},{"value":"code"},{"value":"check"},{"value":"play"},{"value":"bolt"},{"value":"lock"},{"value":"none","label":"Sin iconos (se dibuja el número)"}],"group":"Tarjetas"},

  {"id":"numberCaption","type":"string","label":"Número grande · texto (si es ficticio, dilo)","default":"Crecimiento de ingresos de una empresa de ejemplo en cinco ejercicios (datos ilustrativos)","group":"Número grande"},

  {"id":"highlightRect","type":"string","label":"Zona a resaltar en la captura (JSON [x, y, ancho, alto], relativa a la captura 0–1; vacío = sin recuadro)","default":"[0.635, 0.32, 0.11, 0.09]","group":"Tarjeta de captura"},

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Short Reels Motion · Interfaz de lanzamiento</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050508; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050508; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Interfaz de lanzamiento (t2): fondo oscuro con brillos, una cosa por pantalla; el texto emerge del desenfoque, las tarjetas son de vidrio esmerilado y caen con un rebote suave; la captura va en una tarjeta de vidrio con una zona resaltada; el número grande ocupa su propia pantalla.
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: t2_keynote_ui, from huashu-art-motion, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the second the thing first
    shows (a number cue's `at` is when it lands; it starts counting 0.9 s earlier); `word` anchors it to that word of
    the narration once `om voice` has run (skills/short-reels-motion/references/grammars.md).
  - Consecutive cards without an image share one screen (up to 3); a card with `image` gets a screen of its own.
  - Pickable regions (0-based like the spec): title · card-<i> (i-th card/step/image cue) · number-<k> · highlight-<k>.
  - Scenes: title → cards-1 → number-1 → screenshot-1 → highlight-1.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="stage" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "t2_keynote_ui",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "data": { "eyebrow": "{{eyebrow}}", "title": "{{title}}", "subtitle": "{{subtitle}}", "accent": "{{accent}}" },
  "cues": [
    { "at": 0.0, "kind": "title" },
    { "at": 2.2, "kind": "card", "word": "gramáticas", "text": "{{card1Title}}", "sub": "{{card1Sub}}", "data": { "icon": "{{card1Icon}}" } },
    { "at": 3.0, "kind": "card", "word": "cuadros", "text": "{{card2Title}}", "sub": "{{card2Sub}}", "data": { "icon": "{{card2Icon}}", "value": "{{card2Value}}", "suffix": "{{card2Suffix}}", "label": "{{card2Label}}" } },
    { "at": 3.8, "kind": "card", "word": "Vertical", "text": "{{card3Title}}", "sub": "{{card3Sub}}", "data": { "icon": "{{card3Icon}}" } },
    { "at": 6.0, "kind": "number", "word": "7.8", "text": "{{numberCaption}}", "data": { "value": "{{numberValue}}", "decimals": "{{numberDecimals}}", "prefix": "{{numberPrefix}}", "suffix": "{{numberSuffix}}" } },
    { "at": 7.2, "kind": "card", "word": "un cuadro", "text": "{{shotTitle}}", "sub": "{{shotSub}}", "image": "{{shotImage}}" },
    { "at": 8.4, "kind": "highlight", "word": "veces", "data": { "rect": "{{highlightRect|json}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/t2_keynote_ui.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      for (const q of spec.cues) {
        if (q.data && q.data.icon === 'none') delete q.data.icon;
        if (q.data && q.data.label === '') delete q.data.label;
        if (q.kind === 'card' && 'image' in q && !q.image) delete q.image;   // no screenshot path → a plain feature card
      }
      // the box sits on a screenshot: drop it when there is no screenshot card or no rect
      const hasShot = spec.cues.some((q) => q.image);
      spec.cues = spec.cues.filter((q) => q.kind !== 'highlight' || (hasShot && Array.isArray(q.data && q.data.rect) && q.data.rect.length === 4));
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
