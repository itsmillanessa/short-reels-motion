<!doctype html>
<html lang="es-MX" data-composition-variables='[
  {"id":"title","type":"string","label":"Barra de título (blanco sobre negro, aparece tecleada)","default":"Estas dos imágenes están dibujadas con código","group":"Texto"},
  {"id":"image1","type":"string","label":"Imagen 1 · ruta (captura / recorte, ponlo en assets/, relativa a index.html)","default":"assets/kline.png","group":"Material"},
  {"id":"image1Label","type":"string","label":"Imagen 1 · etiqueta inferior (si es ficticio, dilo)","default":"t3 Gráfica financiera: velas diarias (datos ilustrativos)","group":"Material"},
  {"id":"highlightRect","type":"string","label":"Imagen 1 · zona a subrayar (JSON [x, y, ancho, alto], relativa a la imagen 0–1; vacío = sin subrayado)","default":"[0.745, 0.25, 0.105, 0.095]","group":"Material"},
  {"id":"note","type":"string","label":"Ficha (tarjeta rayada, tecleada; vacío = no aparece)","default":"El precio de cierre se asienta cuando crece la última vela","group":"Texto"},
  {"id":"image2","type":"string","label":"Imagen 2 · ruta (vacío = no aparece)","default":"assets/revenue-portrait.png","group":"Material"},
  {"id":"image2Label","type":"string","label":"Imagen 2 · etiqueta inferior","default":"La misma gráfica, con otra maqueta en vertical","group":"Material"},
  {"id":"halftone","type":"boolean","label":"Imágenes en semitono gris (como impresión de periódico)","default":false,"group":"Material"},
  {"id":"accent","type":"color","label":"Color de la línea y el círculo rojos","default":"#b8433f","group":"Color"},
  {"id":"duration","type":"number","label":"Duración (s; con narración, al menos hasta que termine)","default":9,"min":2,"max":120,"step":0.5,"group":"Ritmo"},
  {"id":"pace","type":"number","label":"Factor de ritmo (1 = normal; una tarjeta suele quedarse 3–7 s)","default":1,"min":0.5,"max":4,"step":0.1,"group":"Ritmo"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Short Reels Motion · Escritorio collage estilo Vox</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e4ddcf; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #e4ddcf; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Vox collage (y2): un escritorio grande = el mundo; el material se va colocando en orden y se une con hilo rojo; la cámara lo sigue suavemente y lo que está sobre la mesa avanza a 12 fps («a dos»).
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: y2_vox, from huashu-art-motion, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the second the thing first
    shows; `word` anchors it to that word of the narration once `om voice` has run (skills/short-reels-motion/references/grammars.md).
  - Real screenshots stay as they are (contain, never cropped). Put your own files in assets/ and point image1 / image2 at them.
  - Pickable regions (0-based like the spec): title · image-<i> · note-<i> · highlight-<i>.
  - Scenes: title → image-1 → highlight-1 → note-1 → image-2.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="desk" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "y2_vox",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "data": { "accent": "{{accent}}" },
  "cues": [
    { "at": 0.0, "kind": "title", "text": "{{title}}" },
    { "at": 1.6, "kind": "image", "word": "KLínea", "image": "{{image1}}", "text": "{{image1Label}}", "data": { "halftone": "{{halftone}}" } },
    { "at": 3.4, "kind": "highlight", "word": "cierre", "data": { "rect": "{{highlightRect|json}}" } },
    { "at": 5.6, "kind": "point", "word": "se asienta", "text": "{{note}}" },
    { "at": 7.0, "kind": "image", "word": "Vertical", "image": "{{image2}}", "text": "{{image2Label}}", "data": { "halftone": "{{halftone}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/y2_vox.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      // an image cue without a path is not on the desk; a highlight needs the image before it and a rect
      spec.cues = spec.cues.filter((q) => q.kind !== 'image' || String(q.image || '').trim());
      spec.cues = spec.cues.filter((q, i) => q.kind !== 'highlight' || (Array.isArray(q.data && q.data.rect) && q.data.rect.length === 4 && spec.cues.slice(0, i).some((z) => z.kind === 'image')));
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
