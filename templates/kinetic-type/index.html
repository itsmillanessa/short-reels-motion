<!doctype html>
<html lang="es-MX" data-composition-variables='[
  {"id":"titleWord","type":"string","label":"Apertura · palabra principal","default":"Programar con IA","group":"apertura"},
  {"id":"titleSub","type":"string","label":"Apertura · frase secundaria","default":"en tres etapas","group":"apertura"},
  {"id":"item1","type":"string","label":"Elemento 1 · palabra principal (vacío = una página menos)","default":"completar","group":"Elemento 1"},
  {"id":"item1Sub","type":"string","label":"Elemento 1 · frase secundaria","default":"Él completa la siguiente línea","group":"Elemento 1"},
  {"id":"item1Key","type":"string","label":"Elemento 1 · palabra a colorear en la frase","default":"la siguiente línea","group":"Elemento 1"},
  {"id":"item1Label","type":"string","label":"Elemento 1 · etiqueta superior izquierda","default":"Etapa 01","group":"Elemento 1"},
  {"id":"item2","type":"string","label":"Elemento 2 · palabra principal (vacío = una página menos)","default":"conversar","group":"Elemento 2"},
  {"id":"item2Sub","type":"string","label":"Elemento 2 · frase secundaria","default":"Una frase a cambio de un bloque entero","group":"Elemento 2"},
  {"id":"item2Key","type":"string","label":"Elemento 2 · palabra a colorear en la frase","default":"un bloque entero","group":"Elemento 2"},
  {"id":"item2Label","type":"string","label":"Elemento 2 · etiqueta superior izquierda","default":"Etapa 02","group":"Elemento 2"},
  {"id":"item3","type":"string","label":"Elemento 3 · palabra principal (vacío = una página menos)","default":"agente","group":"Elemento 3"},
  {"id":"item3Sub","type":"string","label":"Elemento 3 · frase secundaria","default":"Tú solo dices qué quieres","group":"Elemento 3"},
  {"id":"item3Key","type":"string","label":"Elemento 3 · palabra a colorear en la frase","default":"qué quieres","group":"Elemento 3"},
  {"id":"item3Label","type":"string","label":"Elemento 3 · etiqueta superior izquierda","default":"Etapa 03","group":"Elemento 3"},
  {"id":"highlightWord","type":"string","label":"Palabra que el marcador resalta al final (debe estar en la palabra principal de la última página; vacío = sin resaltado)","default":"agente","group":"cierre"},
  {"id":"palette","type":"string","label":"Paleta (JSON:[[Color de fondo, Color del texto], …] rota por página)","default":"[[\"#FFD23F\",\"#111111\"],[\"#FF5A36\",\"#FFFFFF\"],[\"#14213D\",\"#FFD23F\"],[\"#F4EFE6\",\"#111111\"]]","group":"cierre"},
  {"id":"duration","type":"number","label":"Duración (s; con narración, al menos hasta que termine)","default":8,"min":2,"max":120,"step":0.5,"group":"Ritmo"},
  {"id":"pace","type":"number","label":"Factor de ritmo (1 = normal; una palabra principal de 2 caracteres se queda al menos 0.5 s, la frase secundaria al menos 1 s)","default":1,"min":0.5,"max":4,"step":0.1,"group":"Ritmo"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Short Reels Motion · Tipografía cinética</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #FFD23F; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #FFD23F; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Tipografía cinética (y5): las palabras son los actores. Un cue por página, la palabra principal entra de golpe en el cuadro at, la frase secundaria sube desde su ranura; el cambio de página es un barrido de color (empieza 0.3 s antes de at).
  más de dos páginas point = una lista: se dibuja la pista de progreso y el número gigante de fondo.
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: y5_kinetic_type, from huashu-art-motion, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the frame the word slams in;
    `word` anchors it to that word of the narration once `om voice` has run (skills/short-reels-motion/references/grammars.md).
  - Pickable regions (0-based page index, title page = 0): word-<i> · sub-<i> · label-<i> · track · marker.
  - Scenes: title → item-1 → item-2 → item-3 → highlight-1.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="page" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "y5_kinetic_type",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "data": { "palette": "{{palette|json}}" },
  "cues": [
    { "at": 0.0, "kind": "title", "text": "{{titleWord}}", "sub": "{{titleSub}}" },
    { "at": 1.9, "kind": "point", "word": "completar", "text": "{{item1}}", "sub": "{{item1Sub}}", "data": { "label": "{{item1Label}}", "key": "{{item1Key}}" } },
    { "at": 3.6, "kind": "point", "word": "conversar", "text": "{{item2}}", "sub": "{{item2Sub}}", "data": { "label": "{{item2Label}}", "key": "{{item2Key}}" } },
    { "at": 5.3, "kind": "point", "word": "agente", "text": "{{item3}}", "sub": "{{item3Sub}}", "data": { "label": "{{item3Label}}", "key": "{{item3Key}}" } },
    { "at": 6.4, "kind": "highlight", "word": "qué quieres", "data": { "word": "{{highlightWord}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/y5_kinetic_type.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      const pal = spec.data.palette;
      if (pal !== undefined && !(Array.isArray(pal) && pal.length && pal.every((p) => Array.isArray(p) && p.length === 2))) { CLIP.problem('palette debe escribirse como [[Color de fondo, Color del texto], …]'); delete spec.data.palette; }
      if (pal === undefined) delete spec.data.palette;
      spec.cues = spec.cues.filter((q) => q.kind !== 'highlight' || String(q.data.word || '').trim());
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
